<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Order Dashboard</title><link rel="stylesheet" href="styles.css"><style>.dashboard{max-width:1180px;margin:40px auto;padding:20px}.dashboard h1{font-family:Georgia,serif}.toolbar{display:flex;justify-content:flex-end}.toolbar a{background:var(--red);color:#fff;text-decoration:none;padding:11px 16px;border-radius:8px;font-weight:800}table{width:100%;border-collapse:collapse;background:#fff;margin-top:20px}th,td{padding:13px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{background:#f3f1ed}@media(max-width:700px){table{display:block;overflow-x:auto}}</style></head><body><header class="topbar"><div class="brand"><span class="brand-mark">S</span><span>ORDER DASHBOARD</span></div><a href="/">Pre-order page</a></header><main class="dashboard"><h1>Community shirt orders</h1><div class="toolbar"><a href="/api/orders/export.csv">Download CSV</a></div><table><thead><tr><th>Order ID</th><th>Name</th><th>Relationship</th><th>Parent ID</th><th>Size type</th><th>Size</th><th>Display number</th><th>Display name</th><th>Memo</th><th>Date</th></tr></thead><tbody id="orders"></tbody></table></main><script>fetch('/api/orders').then(r=>r.ok?r.json():[]).then(orders=>{document.querySelector('#orders').innerHTML=orders.map(o=>`<tr><td>#${o.orderId}</td><td>${escapeHtml(o.name)}</td><td>${escapeHtml(o.relationship)}</td><td>${o.parentOrderId||'-'}</td><td>${escapeHtml(o.sizeCategory)}</td><td>${escapeHtml(o.size)}</td><td>${escapeHtml(o.customDisplayNumber||'-')}</td><td>${escapeHtml(o.customDisplayName||'-')}</td><td>${escapeHtml(o.memo||'-')}</td><td>${o.createdAt?new Date(o.createdAt).toLocaleDateString():'-'}</td></tr>`).join('')||'<tr><td colspan="10">No orders yet</td></tr>'}).catch(()=>{document.querySelector('#orders').innerHTML='<tr><td colspan="10">Could not load orders</td></tr>'});function escapeHtml(v){const d=document.createElement('div');d.textContent=v||'';return d.innerHTML}</script></body></html>
